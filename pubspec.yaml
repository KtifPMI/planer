name: tracker_app
description: Персональный трекер привычек, финансов, тренировок и планер
publish_to: 'none'
version: 1.1.4+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.2.0

  # UUID
  uuid: ^4.3.3

  # Charts
  fl_chart: ^0.68.0

  # Localization
  intl: ^0.19.0

  # Google Fonts
  google_fonts: ^6.2.1

  # Gap
  gap: ^3.0.1

  # Icons
  cupertino_icons: ^1.0.8

  # HTTP & updates
  http: ^1.2.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/
